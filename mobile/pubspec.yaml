name: vigorai_app
description: "VigorAI: 3D Gym & Health Log — Ung dung Quan ly Suc khoe & Luyen tap Gym 3D ket hop Tri tue Nhan tao"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# [LOCKED - CHOT SPRINT 1 NGAY 2]
# Moi thay doi package sau Ngay 2 bat buoc tao Micro-PR rieng va merge trong 15 phut.
dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Network & Sync
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  workmanager: ^0.5.2

  # Offline-First SQLite Database (Drift)
