# [OWNER: M3] Moi truong local Docker: PostgreSQL 16 + MinIO (S3/CDN) + FastAPI
services:
  postgres:
    image: postgres:16-alpine
    container_name: gym3d_postgres
    environment:
      POSTGRES_USER: gym3d_user
      POSTGRES_PASSWORD: gym3d_dev_password
      POSTGRES_DB: gym3d_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym3d_user -d gym3d_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gym3d_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    container_name: gym3d_fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gym3d_user:gym3d_dev_password@postgres:5432/gym3d_db
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: gym3d-assets
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
